room = "2.6.1"
ksp = "2.0.21-1.0.27"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
coroutines = "1.9.0"
onnxruntime = "1.26.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
workManager = "2.10.0"
hiltWork = "1.2.0"
