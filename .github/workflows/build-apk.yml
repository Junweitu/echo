name: Build Echo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app-android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: echo-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app-android/**/*.gradle*

      - name: Prepare stable Echo signing key
        env:
          ECHO_KEYSTORE_B64: ${{ secrets.ECHO_KEYSTORE_B64 }}
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ECHO_KEYSTORE_B64" ] || [ -z "$ECHO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing ECHO_KEYSTORE_B64 or ECHO_KEYSTORE_PASSWORD repository secret"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/echo-signing"
          printf '%s' "$ECHO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/echo-signing/echo-signing.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/echo-signing/echo-signing.jks" \
            -storepass "$ECHO_KEYSTORE_PASSWORD" \
            -alias echo >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Convert app source text to Taiwan Traditional Chinese
        run: |
          python3 -m pip install --quiet opencc-python-reimplemented
          python3 - <<'PY'
          from pathlib import Path
          from opencc import OpenCC

          cc = OpenCC('s2twp')
          roots = [
              Path('app-android/app/src/main/java'),
              Path('app-android/app/src/main/res'),
          ]
          changed = 0
          for root in roots:
              for p in root.rglob('*'):
                  if p.suffix not in {'.kt', '.java', '.xml'} or not p.is_file():
                      continue
                  text = p.read_text(encoding='utf-8')
                  converted = cc.convert(text)
                  if converted != text:
                      p.write_text(converted, encoding='utf-8')
                      changed += 1
          print(f'Traditionalized {changed} source files')
          PY

      - name: Do not claim voice-call audio focus for background recording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app-android/app/src/main/java/tech/echo/app/core/audio/RecordingService.kt')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    private fun requestAudioFocus\(\): Boolean \{.*?'
              r'    private fun abandonAudioFocus\(\) \{.*?\n    \}\n',
              re.S,
          )
          replacement = "\n".join([
              "    private fun requestAudioFocus(): Boolean {",
              "        // Echo only captures microphone audio; do not claim VOICE_COMMUNICATION focus.",
              "        Log.i(TAG, \"audio focus intentionally not requested for microphone-only capture\")",
              "        focusRequest = null",
              "        return true",
              "    }",
              "",
              "    private fun abandonAudioFocus() {",
              "        focusRequest = null",
              "    }",
              "",
          ])
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Unable to patch RecordingService audio-focus methods')
          p.write_text(updated, encoding='utf-8')
          print('Patched RecordingService: no VOICE_COMMUNICATION Audio Focus')
          PY

      - name: Bundle offline Chinese Vosk model
        run: |
          mkdir -p app-android/app/src/main/assets
          curl -L --fail --retry 3 -o /tmp/vosk-cn.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q /tmp/vosk-cn.zip -d app-android/app/src/main/assets
          test -f app-android/app/src/main/assets/vosk-model-small-cn-0.22/am/final.mdl

      - name: Make Gradle wrapper executable
        working-directory: app-android
        run: chmod +x gradlew

      - name: Build stable-signed debug APK
        working-directory: app-android
        env:
          ECHO_KEYSTORE_PATH: ${{ runner.temp }}/echo-signing/echo-signing.jks
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug --console=plain

      - name: Verify stable signing certificate
        run: |
          APK="app-android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED="00f271bc954d9e2b43eb4b46954017e43088d5ba06a91e206f33d06b0ea24a91"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-stable-signed-debug-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
