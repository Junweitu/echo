name: Build Echo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app-android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app-android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Bundle offline Chinese Vosk model
        run: |
          mkdir -p app-android/app/src/main/assets
          curl -L --fail --retry 3 -o /tmp/vosk-cn.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q /tmp/vosk-cn.zip -d app-android/app/src/main/assets
          test -f app-android/app/src/main/assets/vosk-model-small-cn-0.22/am/final.mdl

      - name: Make Gradle wrapper executable
        working-directory: app-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: app-android
        run: ./gradlew --no-daemon :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-local-asr-debug-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
