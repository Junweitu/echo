name: Build Echo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app-android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: echo-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app-android/**/*.gradle*

      - name: Prepare stable Echo signing key
        env:
          ECHO_KEYSTORE_B64: ${{ secrets.ECHO_KEYSTORE_B64 }}
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ECHO_KEYSTORE_B64" ] || [ -z "$ECHO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing ECHO_KEYSTORE_B64 or ECHO_KEYSTORE_PASSWORD repository secret"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/echo-signing"
          printf '%s' "$ECHO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/echo-signing/echo-signing.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/echo-signing/echo-signing.jks" \
            -storepass "$ECHO_KEYSTORE_PASSWORD" \
            -alias echo >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Convert app source text to Taiwan Traditional Chinese
        run: |
          python3 -m pip install --quiet opencc-python-reimplemented
          python3 - <<'PY'
          from pathlib import Path
          from opencc import OpenCC

          cc = OpenCC('s2twp')
          roots = [
              Path('app-android/app/src/main/java'),
              Path('app-android/app/src/main/res'),
          ]
          changed = 0
          for root in roots:
              for p in root.rglob('*'):
                  if p.suffix not in {'.kt', '.java', '.xml'} or not p.is_file():
                      continue
                  text = p.read_text(encoding='utf-8')
                  converted = cc.convert(text)
                  if converted != text:
                      p.write_text(converted, encoding='utf-8')
                      changed += 1
          print(f'Traditionalized {changed} source files')
          PY

      - name: Verify direct microphone and ASR runtime source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app-android/app/src/main/java/tech/echo/app/core/audio/RecordingService.kt')
          text = p.read_text(encoding='utf-8')

          required = [
              'SileroVadDetector(applicationContext)',
              'UploadProcessor',
              'wakeLocalAsr(',
              'Channel.CONFLATED',
          ]
          forbidden = [
              'EnergyFallbackVadDetector(SileroVadDetector(applicationContext))',
              'USAGE_VOICE_COMMUNICATION',
              'uploadWorkScheduler.enqueueNow()',
          ]

          for value in required:
              if value not in text:
                  raise SystemExit(f'Missing required runtime source: {value}')
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'Legacy runtime source still present: {value}')

          print('RecordingService source verified: direct Silero VAD + direct local ASR queue')
          PY

      - name: Bundle sherpa-onnx and Zipformer CTC Chinese model
        run: |
          set -euxo pipefail
          mkdir -p app-android/app/libs
          mkdir -p app-android/app/src/main/assets/zipformer_ctc

          curl -L --fail --retry 3 \
            -o app-android/app/libs/sherpa-onnx-1.13.4.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar

          curl -L --fail --retry 3 \
            -o /tmp/zipformer-ctc.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-ctc-zh-int8-2025-07-03.tar.bz2

          rm -rf /tmp/zipformer-ctc-model
          mkdir -p /tmp/zipformer-ctc-model
          tar xjf /tmp/zipformer-ctc.tar.bz2 -C /tmp/zipformer-ctc-model
          MODEL_DIR=$(find /tmp/zipformer-ctc-model -type d -name 'sherpa-onnx-zipformer-ctc-zh-int8-2025-07-03' | head -n 1)
          test -n "$MODEL_DIR"
          cp "$MODEL_DIR/model.int8.onnx" app-android/app/src/main/assets/zipformer_ctc/model.int8.onnx
          cp "$MODEL_DIR/tokens.txt" app-android/app/src/main/assets/zipformer_ctc/tokens.txt
          test -s app-android/app/src/main/assets/zipformer_ctc/model.int8.onnx
          test -s app-android/app/src/main/assets/zipformer_ctc/tokens.txt
          ls -lh app-android/app/libs/sherpa-onnx-1.13.4.aar app-android/app/src/main/assets/zipformer_ctc/*

      - name: Make Gradle wrapper executable
        working-directory: app-android
        run: chmod +x gradlew

      - name: Build stable-signed debug APK
        working-directory: app-android
        env:
          ECHO_KEYSTORE_PATH: ${{ runner.temp }}/echo-signing/echo-signing.jks
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug --console=plain

      - name: Verify stable signing certificate
        run: |
          APK="app-android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED="00f271bc954d9e2b43eb4b46954017e43088d5ba06a91e206f33d06b0ea24a91"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-stable-zipformer-ctc-debug-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
