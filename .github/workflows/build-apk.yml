name: Build Echo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app-android/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: echo-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: app-android/**/*.gradle*

      - name: Prepare stable Echo signing key
        env:
          ECHO_KEYSTORE_B64: ${{ secrets.ECHO_KEYSTORE_B64 }}
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ECHO_KEYSTORE_B64" ] || [ -z "$ECHO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing ECHO_KEYSTORE_B64 or ECHO_KEYSTORE_PASSWORD repository secret"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/echo-signing"
          printf '%s' "$ECHO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/echo-signing/echo-signing.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/echo-signing/echo-signing.jks" \
            -storepass "$ECHO_KEYSTORE_PASSWORD" \
            -alias echo >/dev/null

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Convert app source text to Taiwan Traditional Chinese
        run: |
          python3 -m pip install --quiet opencc-python-reimplemented
          python3 - <<'PY'
          from pathlib import Path
          from opencc import OpenCC

          cc = OpenCC('s2twp')
          roots = [
              Path('app-android/app/src/main/java'),
              Path('app-android/app/src/main/res'),
          ]
          changed = 0
          for root in roots:
              for p in root.rglob('*'):
                  if p.suffix not in {'.kt', '.java', '.xml'} or not p.is_file():
                      continue
                  text = p.read_text(encoding='utf-8')
                  converted = cc.convert(text)
                  if converted != text:
                      p.write_text(converted, encoding='utf-8')
                      changed += 1
          print(f'Traditionalized {changed} source files')
          PY

      - name: Apply microphone and local-ASR runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app-android/app/src/main/java/tech/echo/app/core/audio/RecordingService.kt')
          text = p.read_text(encoding='utf-8')

          # Echo is a microphone recorder, not a VoIP app. Do not claim voice-call audio focus.
          pattern = re.compile(
              r'    private fun requestAudioFocus\(\): Boolean \{.*?'
              r'    private fun abandonAudioFocus\(\) \{.*?\n    \}\n',
              re.S,
          )
          replacement = "\n".join([
              "    private fun requestAudioFocus(): Boolean {",
              "        Log.i(TAG, \"audio focus intentionally not requested for microphone-only capture\")",
              "        focusRequest = null",
              "        return true",
              "    }",
              "",
              "    private fun abandonAudioFocus() {",
              "        focusRequest = null",
              "    }",
              "",
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Unable to patch RecordingService audio-focus methods')

          # Use sherpa-onnx Silero directly. The old RMS energy fallback caused room noise
          # to keep speech open until the 60-second hard split.
          old_vad = 'EnergyFallbackVadDetector(SileroVadDetector(applicationContext))'
          if old_vad not in text:
              raise SystemExit('Unable to find legacy EnergyFallbackVadDetector wrapper')
          text = text.replace(old_vad, 'SileroVadDetector(applicationContext)', 1)

          # Queue ASR work; never cancel an active SenseVoice transcription when a new
          # recording segment arrives.
          text = text.replace('uploadWorkScheduler.enqueueNow()', 'uploadWorkScheduler.enqueue()', 1)

          # When the recording service starts after an app update/restart, immediately
          # enqueue a worker so rows left in UPLOADING/TRANSCRIBING by older cancelled
          # workers are retried even before the next speech segment is recorded.
          marker = '        createChannel()\n'
          if marker not in text:
              raise SystemExit('Unable to find RecordingService onCreate marker')
          text = text.replace(marker, marker + '        uploadWorkScheduler.enqueue()\n', 1)

          p.write_text(text, encoding='utf-8')
          print('Patched RecordingService: no voice focus, direct Silero VAD, queued SenseVoice work')
          PY

      - name: Bundle sherpa-onnx and SenseVoice offline model
        run: |
          set -euxo pipefail
          mkdir -p app-android/app/libs
          mkdir -p app-android/app/src/main/assets/sensevoice

          curl -L --fail --retry 3 \
            -o app-android/app/libs/sherpa-onnx-1.13.4.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar

          curl -L --fail --retry 3 \
            -o /tmp/sensevoice.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09.tar.bz2

          rm -rf /tmp/sensevoice-model
          mkdir -p /tmp/sensevoice-model
          tar xjf /tmp/sensevoice.tar.bz2 -C /tmp/sensevoice-model
          MODEL_DIR=$(find /tmp/sensevoice-model -type d -name 'sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09' | head -n 1)
          test -n "$MODEL_DIR"
          cp "$MODEL_DIR/model.int8.onnx" app-android/app/src/main/assets/sensevoice/model.int8.onnx
          cp "$MODEL_DIR/tokens.txt" app-android/app/src/main/assets/sensevoice/tokens.txt
          test -s app-android/app/src/main/assets/sensevoice/model.int8.onnx
          test -s app-android/app/src/main/assets/sensevoice/tokens.txt
          ls -lh app-android/app/libs/sherpa-onnx-1.13.4.aar app-android/app/src/main/assets/sensevoice/*

      - name: Make Gradle wrapper executable
        working-directory: app-android
        run: chmod +x gradlew

      - name: Build stable-signed debug APK
        working-directory: app-android
        env:
          ECHO_KEYSTORE_PATH: ${{ runner.temp }}/echo-signing/echo-signing.jks
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug --console=plain

      - name: Verify stable signing certificate
        run: |
          APK="app-android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED="00f271bc954d9e2b43eb4b46954017e43088d5ba06a91e206f33d06b0ea24a91"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signing certificate mismatch"
            echo "Expected: $EXPECTED"
            echo "Actual:   $ACTUAL"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-stable-sensevoice-debug-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
